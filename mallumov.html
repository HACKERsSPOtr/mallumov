<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Upload Site</title>
    <style>
        /* Set the background image */
        body {
            background-image: url('https://wallpapers-clan.com/wp-content/uploads/2024/02/monkey-d-luffy-roronoa-zoro-one-piece-desktop-wallpaper-preview.jpg'); /* Replace this with your image URL */
            background-size: cover;  /* Ensures the image covers the entire page */
            background-position: center;  /* Centers the background image */
            background-repeat: no-repeat; /* Prevents the image from repeating */
            margin: 0;
            font-family: Arial, sans-serif;
        }

        a {
            text-decoration: none;
            font-size: 18px;
            color: #4CAF50;
            font-weight: bold;
            position: relative;
            transition: color 0.3s ease-in-out, text-shadow 0.3s ease-in-out, transform 0.5s ease-in-out;
        }

        a:hover {
            color: #FF5733;
            text-shadow: 0 0 10px #FF5733, 0 0 20px #FF5733, 0 0 30px #FF5733;
            transform: scale(1.1);
        }

        a::before {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            background-color: #FF5733;
            bottom: 0;
            left: 0;
            transition: width 0.3s ease;
        }

        a:hover::before {
            width: 100%;
        }
        
        header {
            background-color: rgba(0, 0, 0, 0.6);  /* Slightly darken the header */
            padding: 20px;
            text-align: center;
            color: white;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
        }

        nav ul li {
            display: inline;
            margin: 0 15px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
        }

        section#main-content {
            text-align: center;
            padding: 100px 20px;
            color: white;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div id="logo"><h1>AJ STREMS HERE<h1></div>
        <nav>
            <ul>
                <li><a href="https://aniwatchtv.to" class="button">ANIME</a></li>
                <li><a href="#">UPLODES</a></li>
                <li><a href="https://ogomovies.com.pk" class="button">MOVIES</a></li>
                <li><a href="#">CONTENT</a><li>
            </ul>
        </nav>

    <section id="main-content">
        <div id="intro">
            <h2>Welcome to MovieStream</h2>
            <p>Upload your favorite movies and share them with the world!</p>
            <a href="https://sites.google.com/view/all-movie-world/home" class="button">PLEASE VISIT</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 AJ STREMS HERE. All rights reserved.</p>
    </footer>

</body>
</html>
